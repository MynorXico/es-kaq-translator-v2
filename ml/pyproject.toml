[project]
name = "ml"
version = "0.0.1"
description = "ML data/training/evaluation pipeline for the Spanish<->Kaqchikel translation model"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data"]

[tool.ruff]
line-length = 100
target-version = "py311"
