[project]
name = "translator-ml"
version = "0.0.1"
description = "ML pipeline (data preprocessing, training, evaluation) for the Spanish<->Kaqchikel translator"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "sacrebleu>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "evaluation"]

[tool.ruff]
line-length = 100
target-version = "py311"
