name: CodeQL

# Static application security testing (SAST), per ADR 0001's CI/CD plan
# ("GitHub Actions for PR checks: lint/test/build/security").
#
# Committed as an explicit workflow file rather than relying on the
# repo-settings-only "default setup" toggle, so the security scanning
# config is code-reviewable in a PR like everything else in this repo
# (same philosophy as CDK-native infra over console clicks).
#
# This monorepo has two CodeQL-supported languages: JS/TS (apps/web,
# infra/cdk) and Python (apps/api, ml). `build-mode: none` is correct for
# both -- CodeQL's extractor analyzes source directly without a compile
# step for these languages, so no per-language build/install steps are
# needed here.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly scan of the default branch, independent of PR/push activity,
    # so findings surface even during periods with no open PRs.
    - cron: "17 6 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
