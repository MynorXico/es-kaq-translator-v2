name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: web (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  web-e2e:
    name: web (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e

  infra:
    name: infra (build, test, synth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter infra-cdk build
      - run: pnpm --filter infra-cdk test
      # No AWS credentials in this job by design (ADR 0001/0004) — synth
      # with placeholder mock account IDs/connection ARN instead of real
      # SSM-backed config. See infra/cdk/bin/app.ts.
      - run: pnpm --filter infra-cdk synth --context useMockAccounts=true

  api:
    name: api (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  ml:
    name: ml (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      # facebook/m2m100_418M (ADR 0003) is a ~1.9GB download, pulled by
      # tests/integration/test_tokenizer_extension_real_model.py. Cache the
      # Hugging Face Hub cache dir so this only happens once per model
      # version, not on every CI run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-m2m100_418M-${{ hashFiles('ml/tests/integration/test_tokenizer_extension_real_model.py') }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
